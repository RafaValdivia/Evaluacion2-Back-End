<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamershop | Editar Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: #0a0612;
            background-image:
                radial-gradient(circle at 80% 20%, rgba(255,0,127,.1) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(255,202,40,.05) 0%, transparent 40%);
            color: #f8f9fa;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .font-orbitron { font-family: 'Orbitron', 'Arial Black', sans-serif; }

        .form-wrapper { width: 100%; max-width: 520px; }

        .form-card {
            background: rgba(22, 15, 38, 0.92);
            border: 1px solid #ff007f;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,0,127,.15), 0 20px 60px rgba(0,0,0,.5);
            padding: 2.5rem 2rem;
        }

        .form-header { text-align: center; margin-bottom: 2rem; }
        .form-header i { font-size: 2.5rem; color: #ffca28; display: block; margin-bottom: .5rem; }
        .form-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem; font-weight: 700;
            color: #ffca28; letter-spacing: 1px;
        }
        .form-header p { color: #6c757d; font-size: .95rem; margin-top: .3rem; }
        .editing-name { color: #0dcaf0; font-weight: 700; }

        .field-group { margin-bottom: 1.3rem; }
        .field-label {
            display: block; font-weight: 700;
            font-size: .95rem; color: #ffb3d1;
            margin-bottom: .4rem; letter-spacing: .5px;
        }
        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            background: rgba(0,0,0,.4) !important;
            border: 1px solid rgba(255,255,255,.15) !important;
            border-radius: 10px !important;
            color: #f8f9fa !important;
            padding: .65rem 1rem !important;
            font-family: 'Rajdhani', sans-serif !important;
            font-size: 1rem !important;
            transition: border-color .25s, box-shadow .25s;
            outline: none;
        }
        .field-group input:focus,
        .field-group textarea:focus {
            border-color: #ff007f !important;
            box-shadow: 0 0 0 3px rgba(255,0,127,.15) !important;
        }
        .field-group textarea { resize: vertical; min-height: 90px; }

        .field-error {
            color: #f1aeb5; font-size: .85rem;
            margin-top: .3rem; display: flex;
            align-items: center; gap: .3rem;
        }

        .btn-row { display: flex; gap: .8rem; margin-top: 1.8rem; }
        .btn-update, .btn-cancel {
            flex: 1; padding: .7rem 1rem;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; font-size: .82rem;
            cursor: pointer; text-align: center;
            text-decoration: none;
            display: flex; align-items: center;
            justify-content: center; gap: .4rem;
            border: 2px solid;
            transition: all .3s ease;
        }
        .btn-update { background: #ffca28; border-color: #ffca28; color: #000; }
        .btn-update:hover { background: #fff; border-color: #fff; color: #000; }
        .btn-cancel { background: transparent; border-color: rgba(255,255,255,.2); color: #adb5bd; }
        .btn-cancel:hover { border-color: #adb5bd; color: #fff; }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <div class="form-card">
            <div class="form-header">
                <i class="bi bi-pencil-square"></i>
                <h2>MODIFICAR REGISTRO</h2>
                <p>Editando: <span class="editing-name">{{ juego.titulo }}</span></p>
            </div>

            <form method="POST" novalidate>
                {% csrf_token %}
                {% for field in form %}
                <div class="field-group">
                    <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <div class="field-error">
                        <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}

                <div class="btn-row">
                    <button type="submit" class="btn-update">
                        <i class="bi bi-check-circle-fill"></i> ACTUALIZAR
                    </button>
                    <a href="{% url 'lista_videojuegos' %}" class="btn-cancel">
                        <i class="bi bi-x-circle"></i> CANCELAR
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
