<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamershop | Eliminar Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: #0a0612;
            background-image: radial-gradient(circle at 50% 30%, rgba(220,53,69,.12) 0%, transparent 50%);
            color: #f8f9fa;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .font-orbitron { font-family: 'Orbitron', 'Arial Black', sans-serif; }

        .confirm-wrapper { width: 100%; max-width: 480px; }

        .confirm-card {
            background: rgba(35, 10, 20, 0.95);
            border: 2px solid #dc3545;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(220,53,69,.2), 0 20px 60px rgba(0,0,0,.6);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .danger-icon {
            font-size: 3.5rem;
            color: #dc3545;
            display: block;
            margin-bottom: 1rem;
        }

        .confirm-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #dc3545;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .game-detail-box {
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(220,53,69,.3);
            border-radius: 12px;
            padding: 1rem 1.3rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .3rem 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
            font-size: .95rem;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #6c757d; }
        .detail-value { color: #f8f9fa; font-weight: 600; }
        .detail-name  { color: #0dcaf0; font-weight: 700; }

        .warning-text {
            color: #ffc107;
            font-size: .95rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
        }

        .btn-row { display: flex; gap: .8rem; }
        .btn-confirm, .btn-abort {
            flex: 1; padding: .75rem 1rem;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; font-size: .82rem;
            cursor: pointer;
            text-decoration: none;
            display: flex; align-items: center;
            justify-content: center; gap: .4rem;
            border: 2px solid;
            transition: all .3s ease;
        }
        .btn-confirm { background: #dc3545; border-color: #dc3545; color: #fff; }
        .btn-confirm:hover { background: #ff0044; border-color: #ff0044; box-shadow: 0 0 16px rgba(220,53,69,.5); }
        .btn-abort { background: transparent; border-color: rgba(255,255,255,.2); color: #adb5bd; }
        .btn-abort:hover { border-color: #adb5bd; color: #fff; }
    </style>
</head>
<body>
    <div class="confirm-wrapper">
        <div class="confirm-card">
            <i class="bi bi-exclamation-triangle-fill danger-icon"></i>
            <h2 class="confirm-title">CONFIRMAR ELIMINACIÓN</h2>

            <div class="game-detail-box">
                <div class="detail-row">
                    <span class="detail-label">Título</span>
                    <span class="detail-name">{{ juego.titulo }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Plataforma</span>
                    <span class="detail-value">{{ juego.plataforma }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Precio</span>
                    <span class="detail-value">${{ juego.precio }} CLP</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Stock</span>
                    <span class="detail-value">{{ juego.stock }} unidades</span>
                </div>
            </div>

            <p class="warning-text">
                <i class="bi bi-exclamation-circle-fill"></i>
                Esta acción es <strong>&nbsp;irreversible</strong>. El registro se eliminará permanentemente.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="btn-row">
                    <button type="submit" class="btn-confirm">
                        <i class="bi bi-trash3-fill"></i> SÍ, ELIMINAR
                    </button>
                    <a href="{% url 'lista_videojuegos' %}" class="btn-abort">
                        <i class="bi bi-arrow-left"></i> ABORTAR
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
